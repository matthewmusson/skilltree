# Stanford class -> skill mapping.
# Titles and prerequisites verified against ExploreCourses (the bulletin's
# course API) on 2026-08-31; raw scrape in explorecourses-cache.json.
# LIMITATION: the model has no OR-groups. Where the bulletin says "A or B",
