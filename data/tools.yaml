# Universal tool catalog for the hypothetical shop (college-agnostic layer).
# One entry per machine, added one at a time as the walkthrough covers them.
# videos: labeled demo clips, each a youtube video id (picked by Matthew or vetted).
tools:
  - id: bandsaw
    name: Horizontal bandsaw
    zone: machining
    purpose: >
      Rough-cuts bar and plate stock to approximate length before precision
      work. A continuous toothed blade loop, run slow for metal with fine-pitch
      teeth; the horizontal form bows down through clamped stock under gravity
      feed.
    demonstrates: [machining]
    videos:
      - { youtube: adRgpGQ01gA, label: "Cutting stock to length" }
    typical_shop: true

  - id: drill-press
    name: Drill press
    zone: machining
    purpose: >
      Drills round, perpendicular holes with a bit held in a rigid vertical
      spindle, lowered by lever into work clamped on the table. Also spots,
      countersinks, reams, and squarely starts taps. Location accuracy comes
      from layout and a center punch, so holes whose position is critical move
      to the mill instead.
    demonstrates: [machining]
    videos:
      - { youtube: 8ywiGFqoPSA, label: "Drill press basics" }
    typical_shop: true

  - id: manual-mill
    name: Manual mill
    zone: machining
    purpose: >
      Spins a cutter over a workpiece clamped to a table that moves on measured
      handwheels. Makes flat faces, squared edges, slots, pockets, and holes at
      precise coordinates; the machine of choice whenever a feature's location
      is the spec.
    demonstrates: [machining]
    videos:
      - { youtube: 5ZkP5RW41rg, label: "Manual mill tutorial" }
      - { youtube: ryi5qntPfHc, label: "Edge finder in use" }
    typical_shop: true

  - id: lathe
    name: Engine lathe
    zone: machining
    purpose: >
      Spins the workpiece against a fixed cutting tool, so everything it makes
      is rotationally symmetric and concentric with the spin axis: shafts,
      pins, bushings, spacers, threads. Faces ends flat, turns diameters to
      size, and drills perfectly centered holes from the tailstock.
    demonstrates: [machining]
    videos:
      - { youtube: H6Dnmd3lDzA, label: "Lathe theory (Blondihacks)" }
      - { youtube: QpTtplBIkqk, label: "Lathe in action" }
    typical_shop: true

  - id: cnc-mill
    name: CNC mill
    zone: machining
    purpose: >
      A mill whose table and spindle are driven by motors executing a program.
      CAD geometry becomes CAM toolpaths, then G-code motion commands. Cuts
      curves and pockets no hand crank can trace, and repeats a part
      identically; the operator still owns workholding, tool setup, zeroing,
      and checking the first part.
    demonstrates: [machining, cad]
    videos:
      - { youtube: Do_C_NLH5sw, label: "Fusion 360 CAM for beginners (NYC CNC)" }
    typical_shop: false

  - id: calipers
    name: Calipers
    zone: metrology
    purpose: >
      The everyday measuring instrument: a sliding jaw on a scale that reads
      outside dimensions, inside dimensions, and depths across a 150 mm range.
      Fast and one-handed, trustworthy to roughly ±0.03 mm; the first check on
      nearly every dimension, and the wrong tool for the tightest ones.
    demonstrates: [machining]
    videos:
      - { youtube: oOZjbbe6YZk, label: "Using calipers" }
    typical_shop: true

  - id: micrometer
    name: Micrometer
    zone: metrology
    purpose: >
      A calibrated screw: the spindle advances a known distance per turn of the
      thimble, so 0.01 mm reads directly and ±0.002 mm is realistic. A ratchet
      applies the same measuring force every time. Narrow range per instrument
      (typically 0 to 25 mm); the referee for tight tolerances.
    demonstrates: [machining]
    videos:
      - { youtube: k5AdTiLNiRI, label: "Reading a micrometer" }
    typical_shop: true

  - id: bench-supply
    name: Bench power supply
    zone: electronics
    purpose: >
      An adjustable DC voltage source with a settable current limit. Set the
      voltage your circuit needs and a current ceiling above which the supply
      folds back instead of letting a mistake burn; powers every prototype on
      the bench, including the excitation voltage a sensor bridge runs on.
    demonstrates: [electronic-prototyping]
    videos: []
    typical_shop: true

  - id: multimeter
    name: Multimeter
    zone: electronics
    purpose: >
      Measures DC and AC voltage, current, and resistance, plus continuity.
      Voltage is measured in parallel across a component, current in series
      through it. High input impedance means probing a circuit barely disturbs
      it. The first instrument on any electrical question, for slow signals.
    demonstrates: [electronic-prototyping]
    videos: []
    typical_shop: true
